version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "auto"
    labels:
      - "dependencies"
      - "composer"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    # Tailwind v4 is a breaking major bump: the workbench build
    # (scripts/build-tailwind.php, watch:tailwind) uses the v3 CLI
    # (`tailwindcss -c tailwind.config.js`). Defer major bumps to a
    # deliberate v4 migration task; keep 3.x patch/minor updates flowing.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]


